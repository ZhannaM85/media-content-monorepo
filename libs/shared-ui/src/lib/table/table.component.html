<table class="lib-table">
    <thead>
        <tr>
            @for (col of columns(); track col.key) {
                <th [class.align-center]="col.align === 'center'" [class.align-right]="col.align === 'right'">{{ col.label }}</th>
            }
        </tr>
    </thead>
    <tbody>
        <ng-content></ng-content>
    </tbody>
</table>
