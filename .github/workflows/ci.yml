name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Use same npm as lock file
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Inject environment
        env:
          NX_TMDB_API_KEY: ${{ secrets.NX_TMDB_API_KEY }}
        run: node scripts/inject-env.js

      - name: Build
        run: npx nx build admin-shell --base-href /media-content-monorepo/

      - name: Generate build.txt
        run: |
          node -e "
            const pkg = require('./package.json');
            const now = new Date().toISOString();
            const deps = Object.entries(pkg.dependencies || {})
              .map(([name, version]) => '  ' + name + ': ' + version)
              .join('\n');
            const content =
              'Project: ' + pkg.name + '\n' +
              'Version: ' + pkg.version + '\n' +
              'Description: ' + (pkg.description || '') + '\n' +
              '\n' +
              'Dependencies:\n' + deps + '\n' +
              '\n' +
              'Deployed: ' + now + '\n' +
              'Commit: ' + (process.env.GITHUB_SHA || '') + '\n';
            require('fs').writeFileSync('dist/apps/admin-shell/build.txt', content);
          "

      - name: Copy index.html to 404.html for SPA routing
        run: cp dist/apps/admin-shell/index.html dist/apps/admin-shell/404.html

      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/apps/admin-shell

  deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    needs: build-and-test
    runs-on: ubuntu-latest
    environment: github-pages
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
