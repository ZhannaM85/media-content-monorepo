name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Use same npm as lock file
        run: npm install -g npm@11

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Inject environment
        run: node scripts/inject-env.js

      - name: Build
        run: npx nx build admin-shell
