<h1>Rights</h1>
<p *libHasRole="'editor'">
    <a routerLink="assign/new" class="btn">Assign rights (new)</a>
</p>
<div class="virtual-table-wrapper">
    <table class="lib-table virtual-table-header">
        <thead>
            <tr>
                @for (col of columns; track col.key) {
                    <th [class.align-center]="col.align === 'center'" [class.align-right]="col.align === 'right'">{{ col.label }}</th>
                }
            </tr>
        </thead>
    </table>
    <cdk-virtual-scroll-viewport [itemSize]="rowHeightPx" class="rights-viewport">
        <table class="lib-table">
            <tbody>
                <tr *cdkVirtualFor="let r of rights()" class="lib-table-row">
                    <td class="content-cell">
                        <a [routerLink]="['/content', r.contentId, 'edit']">{{ r.contentId }}</a>
                    </td>
                    <td class="content-cell">{{ r.regions.join(', ') }}</td>
                    <td class="content-cell">{{ r.expirationDate }}</td>
                    <td class="actions-cell">{{ r.gdprAcknowledged ? 'Yes' : '—' }}</td>
                    <td class="actions-cell">
                        <a [routerLink]="['assign', r.contentId]">Edit</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </cdk-virtual-scroll-viewport>
</div>
