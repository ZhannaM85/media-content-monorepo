<header class="shell-header">
    <nav class="shell-nav">
        <a routerLink="/content" routerLinkActive="active">Content</a>
        <a routerLink="/rights" routerLinkActive="active">Rights</a>
    </nav>
    <div class="shell-auth">
        @if (auth.isLoggedIn()) {
        <span class="user"
            >{{ auth.currentUser()?.username }} ({{ auth.currentUser()?.role
            }})</span
        >
        <button type="button" (click)="logout()">Logout</button>
        } @else {
        <a routerLink="/login">Login</a>
        }
    </div>
</header>
<main class="shell-main">
    @if (httpError.error()) {
    <div class="shell-error-banner" role="alert">
        <div class="shell-error-banner__message">
            {{ httpError.error()?.message }}
        </div>
        <div class="shell-error-banner__actions">
            <button
                type="button"
                (click)="clearError()"
                class="shell-error-banner__dismiss"
                aria-label="Dismiss error message"
            >
                Dismiss
            </button>
        </div>
    </div>
    }
    <router-outlet></router-outlet>
</main>
